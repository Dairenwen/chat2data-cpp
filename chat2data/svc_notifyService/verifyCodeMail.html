<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Chat2Data 邮箱验证码</title>
    <style>
        body,
        table,
        td,
        p {
            margin: 0;
            padding: 0;
        }

        body {
            -webkit-text-size-adjust: 100%;
            background: #fafafa;
        }

        img {
            border: 0;
        }

        .font-sans {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
        }

        .font-mono {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }

        /* ---------- 动效（Apple Mail / iOS 邮件 / 部分 Webmail 生效；不支持的客户端自动显示静态版本） ---------- */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes borderPulse {

            0%,
            100% {
                border-color: #d4d4d8;
            }

            50% {
                border-color: #18181b;
            }
        }

        @keyframes scan {
            0% {
                top: -45%;
            }

            100% {
                top: 110%;
            }
        }

        @keyframes dot {

            0%,
            80%,
            100% {
                opacity: .25;
                transform: translateY(0);
            }

            40% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        @keyframes ping {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, .55);
            }

            80%,
            100% {
                box-shadow: 0 0 0 7px rgba(34, 197, 94, 0);
            }
        }

        @keyframes drain {
            from {
                width: 100%;
            }

            to {
                width: 0;
            }
        }

        .a-1 {
            animation: fadeUp .5s ease-out .05s both;
        }

        .a-2 {
            animation: fadeUp .5s ease-out .25s both;
        }

        .a-3 {
            animation: fadeUp .5s ease-out .45s both;
        }

        .a-4 {
            animation: fadeUp .5s ease-out .6s both;
        }

        .a-5 {
            animation: fadeUp .5s ease-out .72s both;
        }

        .a-6 {
            animation: fadeUp .5s ease-out .84s both;
        }

        .dropzone {
            position: relative;
            overflow: hidden;
            animation: borderPulse 3s ease-in-out infinite;
        }

        .scan {
            position: absolute;
            left: 0;
            right: 0;
            top: -45%;
            height: 40%;
            background: linear-gradient(to bottom, rgba(24, 24, 27, 0), rgba(24, 24, 27, .07), rgba(24, 24, 27, 0));
            animation: scan 2.8s linear infinite;
            pointer-events: none;
        }

        .typing span {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #71717a;
            margin-right: 3px;
            animation: dot 1.2s ease-in-out infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
            margin-right: 0;
        }

        .live {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            animation: ping 1.8s ease-out infinite;
        }

        .bar-fill {
            height: 2px;
            background: #18181b;
            animation: drain 300s linear both;
        }

        @media (prefers-reduced-motion: reduce) {

            .a-1,
            .a-2,
            .a-3,
            .a-4,
            .a-5,
            .a-6,
            .dropzone,
            .scan,
            .typing span,
            .live,
            .bar-fill {
                animation: none !important;
            }
        }

        @media only screen and (max-width: 560px) {
            .wrap {
                padding: 16px 12px !important;
            }

            .code {
                font-size: 28px !important;
                letter-spacing: .22em !important;
            }

            .pad {
                padding-left: 18px !important;
                padding-right: 18px !important;
            }
        }

        /* ---------- 深色模式 ---------- */
        @media (prefers-color-scheme: dark) {

            body,
            .bg-page {
                background: #09090b !important;
            }

            .card {
                background: #111113 !important;
                border-color: #27272a !important;
            }

            .divider {
                border-color: #27272a !important;
            }

            .bubble {
                background: #1c1c1f !important;
                border-color: #27272a !important;
            }

            .t-main {
                color: #fafafa !important;
            }

            .t-sub {
                color: #a1a1aa !important;
            }

            .pill {
                background: #1c1c1f !important;
                border-color: #27272a !important;
                color: #a1a1aa !important;
            }

            .logo {
                background: #fafafa !important;
                color: #09090b !important;
            }

            .dropzone {
                background: #0c0c0e !important;
                border-color: #3f3f46 !important;
            }

            .tbl {
                border-color: #27272a !important;
            }

            .th {
                background: #18181b !important;
                color: #a1a1aa !important;
                border-color: #27272a !important;
            }

            .td {
                border-color: #27272a !important;
                color: #e4e4e7 !important;
            }

            .bar-bg {
                background: #27272a !important;
            }

            .bar-fill {
                background: #fafafa !important;
            }

            .badge-ok {
                background: #052e16 !important;
                border-color: #14532d !important;
                color: #86efac !important;
            }
        }
    </style>
</head>

<body class="bg-page font-sans" style="margin:0;padding:0;background:#fafafa;">
    <!-- 收件箱预览文本 -->
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;font-size:1px;line-height:1px;color:#fafafa;">
        您的 Chat2Data 登录验证码为 {{code}}，五分钟内有效。
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg-page"
        style="background:#fafafa;">
        <tr>
            <td align="center" class="wrap font-sans" style="padding:40px 16px;">

                <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0" class="card a-1"
                    style="width:100%;max-width:520px;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;">

                    <!-- 顶栏：对应聊天布局的 header -->
                    <tr>
                        <td class="pad divider" style="padding:16px 24px;border-bottom:1px solid #e4e4e7;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="left" valign="middle">
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td valign="middle">
                                                    <div class="logo font-mono"
                                                        style="width:26px;height:26px;line-height:26px;text-align:center;background:#18181b;color:#fafafa;border-radius:7px;font-size:12px;font-weight:700;">
                                                        C2</div>
                                                </td>
                                                <td valign="middle" class="t-main font-sans"
                                                    style="padding-left:10px;font-size:14px;font-weight:600;color:#18181b;">
                                                    Chat2Data</td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td align="right" valign="middle">
                                        <span class="pill font-mono"
                                            style="display:inline-block;padding:3px 9px;border:1px solid #e4e4e7;border-radius:999px;background:#fafafa;font-size:11px;color:#71717a;">verify
                                            / login</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- 对话区 -->
                    <tr>
                        <td class="pad" style="padding:24px 24px 8px 24px;">

                            <!-- 系统消息 -->
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                class="a-2">
                                <tr>
                                    <td valign="top" width="30" style="padding-right:10px;">
                                        <div class="logo font-mono"
                                            style="width:26px;height:26px;line-height:26px;text-align:center;background:#18181b;color:#fafafa;border-radius:50%;font-size:11px;font-weight:700;">
                                            C2</div>
                                    </td>
                                    <td valign="top">
                                        <div class="bubble t-main font-sans"
                                            style="display:inline-block;padding:10px 14px;background:#f4f4f5;border:1px solid #e4e4e7;border-radius:4px 12px 12px 12px;font-size:14px;line-height:22px;color:#18181b;">
                                            您的 Chat2Data 登录验证码为
                                        </div>
                                    </td>
                                </tr>
                            </table>

                            <!-- 验证码：参考上传组件的 dropzone -->
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                class="a-3" style="margin-top:14px;">
                                <tr>
                                    <td>
                                        <div class="dropzone"
                                            style="border:1.5px dashed #d4d4d8;border-radius:10px;background:#fafafa;padding:22px 12px 20px 12px;text-align:center;">
                                            <div class="scan"></div>
                                            <div class="font-mono t-sub"
                                                style="position:relative;font-size:11px;letter-spacing:.14em;color:#71717a;text-transform:uppercase;">
                                                verification code</div>
                                            <div class="code font-mono t-main"
                                                style="position:relative;margin-top:10px;font-size:36px;line-height:44px;font-weight:700;letter-spacing:.3em;text-indent:.3em;color:#18181b;">
                                                {{code}}</div>
                                        </div>
                                    </td>
                                </tr>
                            </table>

                            <!-- 等待输入：打字指示 -->
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" class="a-4"
                                style="margin-top:14px;">
                                <tr>
                                    <td class="typing" valign="middle" style="padding-right:10px;">
                                        <span></span><span></span><span></span></td>
                                    <td valign="middle" class="t-sub font-sans" style="font-size:12px;color:#71717a;">
                                        等待你在登录页输入验证码</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- 信息表：参考数据表格组件 -->
                    <tr>
                        <td class="pad" style="padding:16px 24px 0 24px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                class="tbl a-5"
                                style="border:1px solid #e4e4e7;border-radius:8px;border-collapse:separate;border-spacing:0;overflow:hidden;">
                                <tr>
                                    <td class="th font-mono" width="34%"
                                        style="padding:8px 14px;background:#fafafa;border-bottom:1px solid #e4e4e7;font-size:11px;color:#71717a;">
                                        项目</td>
                                    <td class="th font-mono"
                                        style="padding:8px 14px;background:#fafafa;border-bottom:1px solid #e4e4e7;font-size:11px;color:#71717a;">
                                        详情</td>
                                </tr>
                                <tr>
                                    <td class="td font-sans"
                                        style="padding:11px 14px;border-bottom:1px solid #f4f4f5;font-size:13px;color:#71717a;">
                                        用途</td>
                                    <td class="td font-sans"
                                        style="padding:11px 14px;border-bottom:1px solid #f4f4f5;font-size:13px;color:#18181b;">
                                        登录 Chat2Data</td>
                                </tr>
                                <tr>
                                    <td class="td font-sans"
                                        style="padding:11px 14px;border-bottom:1px solid #f4f4f5;font-size:13px;color:#71717a;">
                                        有效期</td>
                                    <td class="td font-mono"
                                        style="padding:11px 14px;border-bottom:1px solid #f4f4f5;font-size:13px;color:#18181b;">
                                        5 分钟</td>
                                </tr>
                                <tr>
                                    <td class="td font-sans" style="padding:11px 14px;font-size:13px;color:#71717a;">状态
                                    </td>
                                    <td class="td" style="padding:11px 14px;">
                                        <span class="badge-ok font-sans"
                                            style="display:inline-block;padding:2px 9px 2px 8px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:999px;font-size:12px;color:#15803d;">
                                            <span class="live"
                                                style="margin-right:6px;vertical-align:middle;"></span><span
                                                style="vertical-align:middle;">有效</span>
                                        </span>
                                    </td>
                                </tr>
                            </table>

                            <!-- 有效期进度条（装饰性，打开邮件后从 5 分钟开始走） -->
                            <div class="bar-bg a-6"
                                style="margin-top:12px;height:2px;background:#e4e4e7;border-radius:2px;overflow:hidden;">
                                <div class="bar-fill" style="width:100%;height:2px;background:#18181b;"></div>
                            </div>
                        </td>
                    </tr>

                    <!-- 说明与页脚 -->
                    <tr>
                        <td class="pad" style="padding:20px 24px 24px 24px;">
                            <p class="t-main font-sans" style="font-size:13px;line-height:22px;color:#3f3f46;">
                                验证码在五分钟内有效，请妥善保管。</p>
                            <p class="t-sub font-sans"
                                style="margin-top:4px;font-size:12px;line-height:20px;color:#71717a;">
                                请勿将验证码告知他人。如非本人操作，请忽略此邮件。</p>
                        </td>
                    </tr>

                    <tr>
                        <td class="pad divider" style="padding:14px 24px;border-top:1px solid #e4e4e7;">
                            <p class="t-sub font-mono" style="font-size:11px;line-height:18px;color:#a1a1aa;">
                                此邮件由系统自动发送，请勿直接回复 · Chat2Data</p>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>
</body>

</html>
