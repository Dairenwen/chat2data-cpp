<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7f5">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://cdn.cnbj1.fds.api.mi-img.com; font-src 'self' https://cdn.cnbj1.fds.api.mi-img.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Chat2Excel · Excel 数据分析助手</title>
  <!-- 与参考页使用相同的官方 MiSans 字体资源，未加载时使用系统中文字体。 -->
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="vendor/highlight-github.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <h1>Chat2Excel</h1>
      <p>基于AI的Excel数据分析助手,上传您的Excel文件,即可获得智能化的数据分析和建议</p>
    </header>

    <section class="upload-section" aria-label="上传 Excel 文件">
      <div class="upload-row">
        <button class="choose-button" id="choose-file" type="button">
          <img src="icons/file-spreadsheet.svg" alt="" width="18" height="18">选择文件
        </button>
        <input id="file-input" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
        <label for="file-path" class="sr-only">已选择的 Excel 文件</label>
        <input id="file-path" class="file-path" type="text" readonly placeholder="选择一份 .xlsx 文件，开始分析" title="浏览器为保护隐私，仅提供文件名或隐藏真实路径的文件路径。">
        <span class="file-type">.xlsx</span>
      </div>
      <div class="upload-meta">
        <p id="upload-status" class="upload-status" role="status">支持 .xlsx 格式，选择后自动上传</p>
        <span id="connection-status" class="connection-status" role="status" data-state="checking"><span class="status-dot" aria-hidden="true"></span><span id="connection-label">正在连接</span></span>
      </div>
    </section>

    <section class="chat-workspace" aria-label="Excel 分析对话">
      <div class="conversation-wrap">
        <div id="conversation" class="conversation" role="log" aria-label="对话消息" aria-live="off" tabindex="0">
          <div class="empty-state" id="empty-state">
            <div class="empty-icon"><img src="icons/chart-no-axes-combined.svg" alt="" width="30" height="30"></div>
            <p class="eyebrow">从数据，到洞察</p>
            <h2>让每一张表，都有答案</h2>
            <p class="empty-description">上传 Excel，聊聊你想了解什么。<br>数据概览、趋势分析，或是那些容易忽略的细节。</p>
            <div class="suggestions" aria-label="问题示例">
              <button type="button" data-question="请概括这份 Excel 的主要内容，并总结关键指标。"><span>快速了解</span>总结表格中的关键指标</button>
              <button type="button" data-question="请分析数据的变化趋势，找出值得关注的增长或下降。"><span>发现趋势</span>看看数据如何变化</button>
              <button type="button" data-question="请检查数据中的异常值、缺失值和重复项，并给出建议。"><span>检查异常</span>找出值得关注的细节</button>
            </div>
          </div>
          <div id="messages" class="messages"></div>
        </div>
        <button id="scroll-bottom" class="scroll-bottom" type="button" aria-label="滚动到最新消息" hidden><img src="icons/arrow-down.svg" alt="" width="18" height="18"></button>
      </div>

      <form id="message-form" class="composer">
        <label class="sr-only" for="message-input">向 Excel 数据分析助手提问</label>
        <textarea id="message-input" rows="2" placeholder="请输入您的消息...(Enter发送，Shift+Enter换行)" aria-describedby="composer-hint character-count"></textarea>
        <div class="composer-actions">
          <button id="send-button" class="send-button" type="submit" disabled><span>发送</span><img src="icons/arrow-up.svg" alt="" width="17" height="17"></button>
          <span id="character-count" class="character-count" aria-label="已输入字数，最多 2000 字">0/2000</span>
        </div>
      </form>
    </section>
    <footer class="page-footer"><span id="composer-hint" role="status">上传文件后，即可开始提问</span><span>AI 生成的内容仅供参考，请核对重要数据</span></footer>
    <noscript>请启用浏览器 JavaScript，以使用文件上传与智能对话。</noscript>
    <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
